<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found · NimbusDesk Admin</title>
<link rel="icon" type="image/svg+xml" href="assets/images/logos/favicon.svg">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/aos.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("nimbus-theme"),s=ls.getItem("nimbus-skin"),sb=ls.getItem("nimbus-sidebar-style"),lw=ls.getItem("nimbus-layout-width");
if(t)d.setAttribute("data-theme",t);
if(s)d.setAttribute("data-skin",s);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body data-theme="light">
<script>window.NIMBUS_BASE = "";</script>
<div class="error-shell">
  <div data-aos="zoom-in">
    <img src="assets/images/illustrations/error-404.svg" style="width:320px;max-width:80vw;" class="mb-3" alt="">
    <div class="error-code">404</div>
    <h4 class="mt-2 mb-2">Page not found</h4>
    <p class="text-muted-c mb-4">The page you're looking for doesn't exist or may have moved.</p>
    <div class="d-flex gap-2 justify-content-center">
      <a href="index.html" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
      <button class="btn btn-light" onclick="history.back()"><i class="bi bi-arrow-left me-1"></i>Go Back</button>
    </div>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/aos.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
