<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance · NimbusDesk Admin</title>
<link rel="icon" type="image/svg+xml" href="assets/images/logos/favicon.svg">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/aos.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("nimbus-theme"),s=ls.getItem("nimbus-skin"),sb=ls.getItem("nimbus-sidebar-style"),lw=ls.getItem("nimbus-layout-width");
if(t)d.setAttribute("data-theme",t);
if(s)d.setAttribute("data-skin",s);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body data-theme="light">
<script>window.NIMBUS_BASE = "";</script>
<div class="error-shell">
  <div data-aos="zoom-in">
    <div class="icon-tile bg-soft-warning text-warning-c mx-auto mb-3" style="width:80px;height:80px;font-size:34px;"><i class="bi bi-tools"></i></div>
    <h4 class="mb-2">We'll be right back</h4>
    <p class="text-muted-c mb-4" style="max-width:420px;">NimbusDesk is currently undergoing scheduled maintenance. We expect to be back online shortly.</p>
    <div class="d-flex justify-content-center gap-3 mb-4">
      <div class="text-center"><h4 class="fw-800 mb-0">02</h4><span class="fs-11 text-muted-c">Hours</span></div>
      <div class="text-center"><h4 class="fw-800 mb-0">14</h4><span class="fs-11 text-muted-c">Minutes</span></div>
      <div class="text-center"><h4 class="fw-800 mb-0">50</h4><span class="fs-11 text-muted-c">Seconds</span></div>
    </div>
    <a href="index.html" class="btn btn-primary"><i class="bi bi-arrow-clockwise me-1"></i>Check Again</a>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/aos.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
