<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lock Screen · NimbusDesk Admin</title>
<link rel="icon" type="image/svg+xml" href="../../assets/images/logos/favicon.svg">
<link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
<link rel="stylesheet" href="../../assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../assets/css/aos.css">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("nimbus-theme"),s=ls.getItem("nimbus-skin"),sb=ls.getItem("nimbus-sidebar-style"),lw=ls.getItem("nimbus-layout-width");
if(t)d.setAttribute("data-theme",t);
if(s)d.setAttribute("data-skin",s);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body data-theme="light">
<script>window.NIMBUS_BASE = "../../";</script>
<div class="error-shell">
  <div data-aos="zoom-in">
    <img src="../../assets/images/avatars/av-3.svg" style="width:88px;height:88px;border-radius:50%;border:4px solid #fff;box-shadow:var(--md-shadow-lg);" class="mb-3" alt="">
    <h4 class="mb-1">Arlene Rodriguez</h4>
    <p class="text-muted-c mb-4">Your session is locked. Enter your password to continue.</p>
    <div class="mx-auto" style="max-width:340px;">
      <form class="needs-validation" novalidate>
        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Enter your password" required>
          <button class="btn btn-primary" type="submit"><i class="bi bi-unlock"></i></button>
        </div>
      </form>
      <a href="../../pages/auth/login.html" class="fs-13 fw-600"><i class="bi bi-box-arrow-right me-1"></i>Sign in as a different user</a>
    </div>
  </div>
</div>

<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/aos.js"></script>
<script src="../../assets/js/main.js"></script>

</body>
</html>
