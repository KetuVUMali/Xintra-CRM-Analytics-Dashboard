<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register · NimbusDesk Admin</title>
<link rel="icon" type="image/svg+xml" href="../../assets/images/logos/favicon.svg">
<link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
<link rel="stylesheet" href="../../assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../assets/css/aos.css">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("nimbus-theme"),s=ls.getItem("nimbus-skin"),sb=ls.getItem("nimbus-sidebar-style"),lw=ls.getItem("nimbus-layout-width");
if(t)d.setAttribute("data-theme",t);
if(s)d.setAttribute("data-skin",s);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body data-theme="light">
<script>window.NIMBUS_BASE = "../../";</script>
<div class="auth-shell">
  <div class="auth-visual">
    <span class="blob" style="width:340px;height:340px;background:#fff;top:-100px;left:-100px;"></span>
    <span class="blob" style="width:220px;height:220px;background:#191d3a;bottom:-60px;right:-40px;opacity:.25;"></span>
    <div class="av-content" data-aos="fade-up">
      <div class="d-flex align-items-center gap-2 mb-4">
        <span class="brand-logo" style="box-shadow:0 6px 20px rgba(0,0,0,.25);">N</span>
        <span class="fw-800 fs-4 text-white">Nimbus<span style="color:#ffd1e8;">Desk</span></span>
      </div>
      <h2>Start running your operation from one screen.</h2>
      <p>Create your account and get access to 16 pre-built dashboards in minutes.</p>
      <img src="../../assets/images/illustrations/auth-secure.svg" style="width:100%;max-width:380px;margin-top:20px;" alt="">
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card" data-aos="fade-up">
      <div class="auth-brand d-lg-none"><span class="brand-logo" style="background:linear-gradient(135deg,#6C5DD3,#f6539e);">N</span><span class="fw-800 fs-4 text-heading">NimbusDesk</span></div>
      <h3 class="mb-1">Create an account</h3>
      <p class="text-muted-c mb-4">It's free to get started — no credit card required.</p>
      <form class="needs-validation" novalidate>
        <div class="row g-2 mb-3">
          <div class="col-6"><label class="form-label">First Name</label><input class="form-control" placeholder="Arlene" required></div>
          <div class="col-6"><label class="form-label">Last Name</label><input class="form-control" placeholder="Rodriguez" required></div>
        </div>
        <div class="mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" placeholder="you@company.com" required></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <div class="position-relative"><input type="password" class="form-control" placeholder="Create a strong password" required>
          <button type="button" class="btn btn-icon pwd-toggle-btn position-absolute" style="right:2px; top:2px;"><i class="bi bi-eye"></i></button></div>
        </div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="agreeTerms" required>
          <label class="form-check-label fs-13" for="agreeTerms">I agree to the <a href="../../pages/terms.html">Terms &amp; Conditions</a></label>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
      </form>
      <p class="text-center fs-13 text-muted-c mt-3">Already have an account? <a href="../../pages/auth/login.html" class="fw-700">Sign in</a></p>
    </div>
  </div>
</div>

<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/aos.js"></script>
<script src="../../assets/js/main.js"></script>

</body>
</html>
